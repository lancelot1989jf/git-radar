name: Daily GitHub Finance Radar

on:
  schedule:
    # 00:30 UTC = 08:30 Asia/Shanghai.
    - cron: "30 0 * * *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Report date to generate (YYYY-MM-DD). Defaults to yesterday in Asia/Shanghai."
        required: false
        type: string
      force:
        description: "Overwrite existing report for target_date."
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: daily-radar-${{ github.workflow }}-${{ github.event.inputs.target_date || github.ref }}
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set target date
        id: date
        env:
          INPUT_TARGET_DATE: ${{ github.event.inputs.target_date }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: |
          if [ -n "$INPUT_TARGET_DATE" ]; then
            target_date="$INPUT_TARGET_DATE"
          else
            target_date="$(date -d "yesterday" +%F)"
          fi

          if [[ ! "$target_date" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "::error::target_date must use YYYY-MM-DD format: $target_date"
            exit 1
          fi

          if [ "$(date -d "$target_date" +%F)" != "$target_date" ]; then
            echo "::error::target_date is not a valid calendar date: $target_date"
            exit 1
          fi

          echo "target_date=$target_date" >> "$GITHUB_OUTPUT"
          echo "force=${INPUT_FORCE:-false}" >> "$GITHUB_OUTPUT"

      - name: Check existing report
        id: existing
        run: |
          report="reports/daily/${{ steps.date.outputs.target_date }}-finance-github-radar.md"
          if [ "${{ steps.date.outputs.force }}" != "true" ] && [ -e "$report" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Existing report found for ${{ steps.date.outputs.target_date }}; set force=true to rerun."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.existing.outputs.skip != 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        if: steps.existing.outputs.skip != 'true'
        run: python -m pytest -q

      - name: Collect GitHub repositories
        if: steps.existing.outputs.skip != 'true'
        run: |
          python scripts/collect_github.py \
            --config config/keywords.yml \
            --out data/snapshots/${{ steps.date.outputs.target_date }}.json

      - name: Rank candidate projects
        if: steps.existing.outputs.skip != 'true'
        run: |
          python scripts/rank_projects.py \
            --snapshot-dir data/snapshots \
            --out data/latest_candidates.json

      - name: Generate report with Codex
        if: steps.existing.outputs.skip != 'true'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: .github/codex/prompts/daily_finance_radar.md
          output-file: reports/daily/${{ steps.date.outputs.target_date }}-finance-github-radar.md
          sandbox: workspace-write
          safety-strategy: drop-sudo

      - name: Commit report and data
        if: steps.existing.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data reports
          git commit -m "daily finance radar ${{ steps.date.outputs.target_date }}" || exit 0
          git push
